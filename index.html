const SUBS=[
{f:"chilli_flakes",t:"green_chilli",q:1,m:"1 fresh chilli ≈ 1 g flakes; fresher heat",tc:0},

];

// ---- core helpers
const DR={vegan:0,veg:1,egg:2,non:3,any:3};
const recDiet=r=>r.ing.reduce((m,x)=>x.o?m:Math.max(m,I[x.id].dt),0);
const needFresh=(g,it)=>g.p===2||(g.ao&&it&&it.o);
const priceOf=(id,ctx)=>{const u=ctx.prices&&ctx.prices[id];return typeof u==="number"&&u>=0?u:I[id].pr};
const unitCost=(id,amt,ctx)=>amt>0?amt*priceOf(id,ctx)/I[id].nb:0;
const buyCost=(id,amt,ctx)=>{if(!(amt>0))return 0;const g=I[id];return Math.ceil(amt/g.pk)*g.pk*priceOf(id,ctx)/g.nb};
const roleW=g=>g.c===8?.25:(g.c===6||g.c===7)?.5:(g.c===4||g.c===5)?1:2;
function usable(id,ctx){
 const it=ctx.pantry[id],g=I[id];
 if(!it){if((ctx.staples||[]).includes(id))return{ok:true,q:null,unk:true,staple:true};return{ok:false,reason:"none"}}
 if(it.st==="out")return{ok:false,reason:"finished"};
 if(needFresh(g,it)&&ctx.prefs.setup==="none"&&!(it.t&&ctx.now-it.t<FRESH_MS))return{ok:false,reason:"stale"};
 const unk=typeof it.q!=="number"||!isFinite(it.q);
 return{ok:true,q:unk?null:it.q,unk,low:it.st==="low"};
}
const blocked=(id,P)=>I[id].al.some(a=>(P.exAl||[]).includes(a))||(P.exIng||[]).includes(id)||I[id].dt>DR[P.diet||"any"];

// ---- ingredient coverage (quantity-weighted)
function coverage(r,ctx){
 const P=ctx.prefs,sv=P.sv>0?P.sv:1,sc=sv/(r.sv>0?r.sv:1);
 const rows=[],miss=[],subs=[],used=[];let ws=0,cs=0,unc=0;
 for(const x of r.ing){
  const g=I[x.id],need=x.q*sc,u=usable(x.id,ctx);
  if(x.o){ if(!blocked(x.id,P)&&u.ok)used.push({id:x.id,q:need}); rows.push({x,g,need,u,st:u.ok?"have":"missing",opt:true});continue }
  const w=roleW(g);ws+=w;let c=0,st="have",have=0,sub=null;
  if(u.ok){ if(u.unk){c=1;st="uncertain";unc++;have=need} else{have=u.q;c=Math.min(u.q/need,1);st=c>=1?"have":"partial"} }
  else st=u.reason==="stale"?"stale":u.reason==="finished"?"finished":"missing";
  if(c<1&&P.subs!==false){
   const s=SUBS.find(s=>s.f===x.id&&(!s.r||s.r.includes(r.id))&&!blocked(s.t,P)&&(()=>{const v=usable(s.t,ctx);return v.ok&&(v.unk||v.q>=(need-have)*s.q)})());
   if(s){sub={from:x.id,to:s.t,q:Math.round((need-have)*s.q*10)/10,note:s.m,tc:s.tc};subs.push(sub);c=Math.max(c,.9);st="swap"}
  }
  const short=sub?0:Math.max(need-have,0);
  if(!sub&&c<1)miss.push({id:x.id,need:Math.round(need*10)/10,have:u.ok&&!u.unk?have:0,buy:Math.round(short*10)/10,cost:buyCost(x.id,short,ctx),reason:st});
  cs+=w*c;rows.push({x,g,need,u,st,have,sub});
 }
 return{rows,miss,subs,used,cov:ws?cs/ws:1,unc};
}

// ---- nutrition: sums ingredient quantity × density / servings. Unknown data => null, never zero.
function nutri(r,usedOpt,sv){
 const keys=["k","p","c","f","fi"],tot=[0,0,0,0,0];let unknown=false;
 const list=r.ing.filter(x=>!x.o).concat((usedOpt||[]).map(o=>({id:o.id,q:o.q/(sv>0?sv/r.sv:1)})));
 for(const x of list){const g=I[x.id];if(!g||!Array.isArray(g.n)){unknown=true;continue}for(let i=0;i<5;i++)tot[i]+=x.q*g.n[i]/g.nb}
 const d=r.sv>0?r.sv:1;
 if(unknown)return{k:null,p:null,c:null,f:null,fi:null,unknown:true};
 const o={unknown:false};keys.forEach((k,i)=>o[k]=Math.round(tot[i]/d*10)/10);return o;
}

// ---- food safety (conservative; no jokes, no guessed shelf lives)
const SAFE={
 channa_dry:"Dry channa needs overnight soaking and thorough boiling. It is not a quick-cook food, and under-cooked pulses are unsafe.",
 soya_dry:"Dry soya chunks are not ready-to-eat. Soak in hot water and cook before eating.",
 paneer:"Paneer is perishable. Buy it fresh the day you cook, or keep it refrigerated as per the pack. Do not treat it as a room-temperature staple.",
 channa_can:"Opened cooked chickpeas are perishable. Use the whole opened portion in one sitting and follow the pack label.",
 egg:"Cook eggs until white and yolk are firm. Never use cracked eggs.",
 rice:"Cooked rice should not sit at room temperature. Eat it now.",
 moong_dry:"Boil pulses until completely soft.",toor_dry:"Boil pulses until completely soft."
};
function safetyWarnings(r,ctx){
 const w=[];
 if(ctx.prefs.setup==="none"&&r.eq.length)w.push("Cook only the portion you'll eat now. You don't have a fridge for leftovers.");
 for(const x of r.ing){if(x.o)continue;const m=SAFE[x.id];if(m&&!w.includes(m))w.push(m)}
 return w;
}
const leftoverAdvice=setup=>setup==="none"?"No fridge: finish the meal in one sitting. Don't keep cooked food for later.":"Cool quickly, refrigerate within 2 hours, eat within a day or two, and reheat until steaming hot.";
const canKeepCooked=setup=>setup!=="none";

// ---- scoring
const DEFW={av:.30,af:.20,pri:.20,time:.10,nut:.10,taste:.05,clean:.05};
const clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));
function evaluate(r,ctx){
 const P=ctx.prefs,F=ctx.filters||{},sv=P.sv>0?P.sv:1;
 const rej=(kind,msg)=>({r,ok:false,kind,msg});
 if(recDiet(r)>DR[P.diet||"any"])return rej("diet","Doesn't match your diet.");
 for(const e of r.eq)if(!hasEq(e,P.eq))return rej("equipment","Needs "+EQN[e.split("|")[0]]+".");
 if(r.fridge&&P.setup==="none")return rej("fridge","Needs refrigeration.");
 for(const x of r.ing)if(!x.o&&blocked(x.id,P))return rej("allergen",I[x.id].name+" is excluded by your settings.");
 if(F.airfryer&&!r.eq.includes("airfryer")&&!r.eq.some(e=>e.includes("airfryer")))return rej("filter","Not an air-fryer recipe.");
 if(F.nocook&&r.eq.length)return rej("filter","Needs cooking.");
 if(F.onepot&&r.cl>2)return rej("filter","More cleanup than one-pot.");
 const total=r.prep+r.cook+r.wait,active=r.prep+r.cook;
 if(F.max&&total>F.max)return rej("time","Takes "+total+" min.");
 const c=coverage(r,ctx);

 return`<div class="sh">${xbtn()}<div class="pic">${art(r.grp,r.id,r.n)}</div><h2>${esc(r.n)}</h2><p>${esc(r.d)}</p>
 ${ev.ok?"":`<div class="card note">Not suitable for your setup: ${esc(ev.msg)}</div>`}
 <div class="pills"><span>${r.prep+r.cook+r.wait} min total</span><span>${r.prep+r.cook} min active</span>${r.wait?`<span>${r.wait} min waiting</span>`:""}<span>${sv} serving${sv>1?"s":""}</span>${cost!=null?`<span>~${rs(cost)}/serving</span>`:""}</div>
 <div class="meta">${nut.unknown?"Nutrition unknown":`~${Math.round(nut.k)} kcal · ${Math.round(nut.p)} g protein · ${Math.round(nut.c)} g carbs · ${Math.round(nut.f)} g fat · ${Math.round(nut.fi)} g fibre`} <span class="mut small">(approximate)</span></div>
 <div class="mut">Equipment: ${r.eq.length?r.eq.map(e=>EQN[e.split("|")[0]]).join(", "):"none (no-cook)"}</div>
 <h3>Ingredients</h3>${cov.rows.map(z=>{const l={have:"✓ have",uncertain:"✓ have (qty unknown)",partial:"short",missing:"missing",stale:"needs fresh purchase",finished:"finished",swap:"swap available"}[z.st];return`<div class="q"><div class="n">${esc(z.g.name)}${z.x.o?' <span class="mut">(optional)</span>':""}</div><span class="mut r">${Math.round(z.need*10)/10} ${z.g.u} · ${z.opt?(z.u.ok?"✓":"not in pantry"):l}</span></div>`}).join("")}
 ${cov.miss.length?`<div class="card note"><b>To buy:</b> ${cov.miss.map(m=>`${esc(I[m.id].name)} (${m.buy} ${I[m.id].u})`).join(", ")}, about ${rs(cov.miss.reduce((a,m)=>a+m.cost,0))}</div>`:""}
 ${cov.subs.map(s=>`<div class="card note"><b>Swap:</b> use ${s.q} ${I[s.to].u} ${esc(I[s.to].name)} instead of ${esc(I[s.from].name)}. ${esc(s.note)}${s.tc?` Time change: ${s.tc} min.`:""}</div>`).join("")}
 ${r.ing.filter(x=>!x.o&&NO_SUB_NOTE[x.id]&&cov.miss.some(m=>m.id===x.id)).map(x=>`<div class="mut small">${NO_SUB_NOTE[x.id]}</div>`).join("")}
 <h3>Steps</h3><ol>${r.steps.map(s=>`<li>${esc(s.t)}${s.m?` <span class="mut">(${s.m} min)</span>`:""}</li>`).join("")}</ol>
 ${safetyWarnings(r,c).map(w=>`<div class="safe">${esc(w)}</div>`).join("")}
 <div class="mut small">${esc(r.note)}</div>
 <div class="foot"><button class="pri" onclick="startCook('${r.id}')">Start cooking</button><button onclick="planAdd('${r.id}')">Add to plan</button></div></div>`;
}
function startCook(rid){S.cook={rid,step:0,checks:{}};save();U.sheet={type:"cook"};render()}
function cookSheet(){
 const r=rec(S.cook.rid),i=S.cook.step,st=r.steps[i],sc=S.prefs.sv/r.sv,last=i===r.steps.length-1;
 return`<div class="sh cook">${xbtn("exitCook()")}<div class="mut">${esc(r.n)} · step ${i+1} of ${r.steps.length}</div><div class="prog"><i style="width:${(i+1)/r.steps.length*100}%"></i></div>
 <div class="bigtxt">${esc(st.t)}</div>
 ${st.m?`<div class="row"><button onclick="startTimer(${st.m})">Start ${st.m}-min timer</button><span id="tmr" class="tmr"></span></div>`:""}
 <details ${i===0?"open":""}><summary>Ingredients checklist</summary>${r.ing.map(x=>`<label class="chk"><input type="checkbox" ${S.cook.checks[x.id]?"checked":""} onchange="chkIng('${x.id}',this.checked)"> ${esc(I[x.id].name)}: ${Math.round(x.q*sc*10)/10} ${I[x.id].u}${x.o?" (optional)":""}</label>`).join("")}</details>
 ${safetyWarnings(r,ctx({})).slice(0,2).map(w=>`<div class="safe">${esc(w)}</div>`).join("")}
 <div class="foot"><button ${i?"":"disabled"} onclick="stepTo(${i-1})">Previous</button>${last?`<button class="pri" onclick="finishCook()">Finish</button>`:`<button class="pri" onclick="stepTo(${i+1})">Next</button>`}</div></div>`;
}
function stepTo(n){S.cook.step=n;save();render()}
function chkIng(id,v){S.cook.checks[id]=!!v;save()}
function exitCook(){U.sheet=null;render()}
function startTimer(m){U.timer={end:Date.now()+m*60000};tick()}
function tick(){const e=$("tmr");if(!U.timer)return;const left=Math.max(0,Math.round((U.timer.end-Date.now())/1000));if(e)e.textContent=left?Math.floor(left/60)+":"+String(left%60).padStart(2,"0"):"Time's up";if(left>0)setTimeout(tick,1000);else{try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}U.timer=null}}
function finishCook(){const r=rec(S.cook.rid);U.fin={rid:r.id,did:null,sel:{},rate:0};r.ing.forEach(x=>{const it=S.pantry[x.id];U.fin.sel[x.id]=!!it&&typeof it.q==="number"&&!x.o});U.sheet={type:"finish"};render()}
function finDid(v){U.fin.did=v;if(!v){S.cook=null;save();U.sheet=null;U.fin=null}render()}
function finSel(id,v){U.fin.sel[id]=v;render()}
function finRate(n){U.fin.rate=n;render()}
function finSave(){
 const r=rec(U.fin.rid),sel=Object.keys(U.fin.sel).filter(k=>U.fin.sel[k]);
 S.pantry=consume(S.pantry,r,S.prefs.sv,sel).pantry;
 if(S.prefs.hist){S.hist.push({rid:r.id,t:Date.now(),rate:U.fin.rate});S.hist=S.hist.slice(-100)}
 S.cook=null;U.fin=null;U.sheet=null;save();render();
}
function finSheet(){
 const r=rec(U.fin.rid),sc=S.prefs.sv/r.sv;
 if(U.fin.did===null)return`<div class="sh"><h2>Did you actually cook it?</h2><p class="mut">Nothing is removed from your pantry unless you say yes.</p><div class="foot"><button class="pri" onclick="finDid(true)">Yes, I cooked it</button><button onclick="finDid(false)">No</button></div></div>`;
 return`<div class="sh"><h2>Mark ingredients used</h2><p class="mut">Known quantities are deducted by what the recipe used, never the whole pack. Unknown quantities stay unless you tick them as finished.</p>
 ${r.ing.filter(x=>S.pantry[x.id]).map(x=>{const it=S.pantry[x.id],known=typeof it.q==="number";return`<label class="chk"><input type="checkbox" ${U.fin.sel[x.id]?"checked":""} onchange="finSel('${x.id}',this.checked)"> ${esc(I[x.id].name)}: ${known?`use ${Math.round(x.q*sc*10)/10} ${I[x.id].u} (have ${it.q})`:"quantity unknown, tick to mark finished"}</label>`}).join("")||'<p class="mut">Nothing from this recipe is in your pantry.</p>'}
 <div class="row">${[1,2,3].map(n=>`<button class="${U.fin.rate>=n?"on":""}" onclick="finRate(${n})" aria-label="${n} star">${"★".repeat(n)}</button>`).join("")}</div><div class="foot"><button class="pri" onclick="finSave()">Save</button></div></div>`;
}
function planSheet(){const rid=U.sheet.rid,days=[];for(let i=0;i<7;i++){const d=new Date(Date.now()+i*864e5);days.push([todayStr(d),i?d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}):"Today"])}
 return`<div class="sh">${xbtn()}<h2>Add to plan</h2><p>${esc(rec(rid).n)}</p><div class="daygrid">${days.map(([d,l])=>`<button onclick="planSave('${rid}','${d}')">${l}</button>`).join("")}</div></div>`}
function customSheet(){return`<div class="sh">${xbtn()}<h2>Add a custom item</h2><p class="mut small">Custom items are tracked in your pantry. Meal suggestions still come from the built-in catalog.</p>
 <label class="fld col">Name<input id="cn" type="text" maxlength="40" value="${esc(U.sheet.name||"")}" placeholder="e.g. Besan"></label>
 <label class="fld col">Category<select id="cc">${CATS.map((c,i)=>`<option value="${i}" ${i===10?"selected":""}>${c}</option>`).join("")}</select></label>
 <label class="fld col">Unit<select id="cu"><option value="g">grams</option><option value="ml">millilitres</option><option value="pcs">pieces</option></select></label>
 <label class="opt"><input id="cf" type="checkbox"> Needs a fridge (perishable)</label>
 <div class="foot"><button class="pri" onclick="custAdd()">Add to pantry</button></div></div>`}
const OB=[
 ()=>`<h2>Storage</h2>${SETUPS.map(([k,l])=>`<label class="opt"><input type="radio" name="ob" ${S.prefs.setup===k?"checked":""} onchange="setPsilent('setup','${k}')"> ${l}</label>`).join("")}`,
 ()=>`<h2>Cooking equipment</h2><p class="mut">Select only what you actually have.</p>${EQ_OPTS.map(([k,l])=>`<label class="opt"><input type="checkbox" ${S.prefs.eq.includes(k)?"checked":""} onchange="toggleSilent('eq','${k}')"> ${l}</label>`).join("")}`,
 ()=>`<h2>Diet</h2>${DIETS.map(([k,l])=>`<label class="opt"><input type="radio" name="ob" ${S.prefs.diet===k?"checked":""} onchange="setPsilent('diet','${k}')"> ${l}</label>`).join("")}`,
 ()=>`<h2>Priorities</h2><p class="mut">Pick any; the first you pick is primary (change later in Settings).</p>${PRI.map(([k,l])=>`<label class="opt"><input type="checkbox" ${S.prefs.pri.includes(k)?"checked":""} onchange="toggleSilent('pri','${k}')"> ${l}</label>`).join("")}`,
 ()=>`<h2>Your pantry</h2><div class="row"><button onclick="loadPreset('sample');obNext()">Sample limited kitchen</button><button onclick="loadPreset('staples');obNext()">Indian staples</button></div>${adder()}`
];
function setPsilent(k,v){S.prefs[k]=v;save()}
function toggleSilent(k,v){const a=S.prefs[k];S.prefs[k]=a.includes(v)?a.filter(x=>x!==v):a.concat(v);if(k==="pri"&&!S.prefs.pri.length)S.prefs.pri=["balanced"];save()}
function obNext(){if(U.ob<OB.length-1){U.ob++;render()}else obDone()}
function obDone(){S.onb=true;save();U.sheet=null;render()}
function onbSheet(){return`<div class="sh"><div class="mut">Step ${U.ob+1} of ${OB.length}</div><div class="prog"><i style="width:${(U.ob+1)/OB.length*100}%"></i></div>${OB[U.ob]()}<div class="foot">${U.ob?`<button onclick="U.ob--;render()">Back</button>`:""}<button class="pri" onclick="obNext()">${U.ob===OB.length-1?"Done":"Next"}</button><button onclick="obDone()">Skip for now</button></div></div>`}
function safetySheet(){return`<div class="sh">${xbtn()}<h2>Food safety</h2><ul>
 <li>No fridge: cook only what you'll eat in one sitting. Cooked rice, pulses, paneer and egg dishes should not be kept at room temperature for later.</li>
 <li>Dry channa and soya chunks are not ready-to-eat. Soak and cook them thoroughly.</li>
 <li>Paneer is perishable. Buy it the day you cook, or keep it refrigerated as per the pack.</li>
 <li>Opened tins, pouches and sauces: follow the product label. Smell and look alone don't prove food is safe.</li>
 <li>Shelf life varies with heat, humidity and handling, so NoFridge never promises exact storage times.</li></ul>
 <p class="mut small">Nutrition and price figures are approximate estimates from typical food-composition values, and you can edit prices.</p>
 <p>Official sources: <a href="https://www.fssai.gov.in" target="_blank" rel="noopener">FSSAI</a> · <a href="https://www.who.int/health-topics/food-safety" target="_blank" rel="noopener">WHO food safety</a> · <a href="https://www.fsis.usda.gov/food-safety" target="_blank" rel="noopener">USDA FSIS</a></p></div>`}
function sheetHtml(){const s=U.sheet;if(!s)return"";let b="";
 if(s.type==="recipe")b=recipeSheet(rec(s.rid));else if(s.type==="cook"&&S.cook)b=cookSheet();else if(s.type==="finish"&&U.fin)b=finSheet();else if(s.type==="plan")b=planSheet();else if(s.type==="custom")b=customSheet();else if(s.type==="onb")b=onbSheet();else if(s.type==="safety")b=safetySheet();
 return`<div class="ov" role="dialog" aria-modal="true">${b}</div>`}
function render(){
 const t=U.tab,m=t==="cook"?cookTab():t==="pantry"?pantryTab():t==="plan"?planTab():settingsTab();
 $("app").innerHTML=header()+`<main>${m}</main>`+fab()+nav();$("sheet").innerHTML=sheetHtml();
 try{document.body.style.overflow=U.sheet?"hidden":""}catch(e){}
}
if(typeof window!=="undefined"&&window.addEventListener){window.addEventListener("offline",()=>{U.off=true;render()});window.addEventListener("online",()=>{U.off=false;render()})}
if(typeof navigator!=="undefined"){U.off=navigator.onLine===false;if(navigator.serviceWorker&&typeof location!=="undefined"&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{})}
if(!S.onb&&!Object.keys(S.pantry).length)U.sheet={type:"onb"};
render();

</script></body></html>
